services:
  authentication:
    build:
      context: ./authentication
    expose: ["8080"]
    environment:
      POSTGRES_URI: postgresql://authentication-db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    volumes:
      - type: bind
        source: ../secrets/keys/jwt-private.pem
        target: /run/secrets/jwt-private.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      authentication-db:
        condition: service_healthy
    restart: unless-stopped

  authentication-db:
    image: postgres:16-alpine
    expose: ["5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - authentication_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rate-limiter:
    build:
      context: ./ratelimiter
    expose: [ "8080" ]
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 0
      MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS}
      WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose: [ "6379" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - authentication
    restart: unless-stopped

volumes:
  authentication_db_data: