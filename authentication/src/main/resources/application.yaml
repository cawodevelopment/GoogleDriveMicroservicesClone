spring:
  application:
    name: authentication
  datasource:
    url: jdbc:${POSTGRES_URI}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH}
  expiration-ms: ${JWT_EXPIRATION_MS}